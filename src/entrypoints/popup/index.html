<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Translate の設定</title>
    <style>
      /* shadcn/ui の zinc テーマに合わせた色。ダークモードにも対応する。 */
      :root {
        --background: #ffffff;
        --foreground: #09090b;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --border: #e4e4e7;
        --ring: #a1a1aa;
        --primary: #18181b;
        --primary-foreground: #fafafa;
        --success: #16a34a;
        --destructive: #dc2626;
        --radius: 8px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #fafafa;
          --muted: #27272a;
          --muted-foreground: #a1a1aa;
          --border: #27272a;
          --ring: #52525b;
          --primary: #fafafa;
          --primary-foreground: #18181b;
          --success: #4ade80;
          --destructive: #f87171;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        width: 340px;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Hiragino Sans',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      p {
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .subtitle {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .content {
        display: grid;
        gap: 16px;
        padding: 16px;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      .label {
        font-size: 13px;
        font-weight: 500;
      }
      .hint {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding: 3px;
        border-radius: var(--radius);
        background: var(--muted);
      }
      .tabs input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .tabs label {
        padding: 6px 8px;
        border-radius: 6px;
        text-align: center;
        font-weight: 500;
        color: var(--muted-foreground);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          box-shadow 0.15s;
      }
      .tabs input:checked + label {
        background: var(--background);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
      }
      .tabs input:focus-visible + label {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .input {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        font: inherit;
        transition: box-shadow 0.15s;
      }
      .input::placeholder {
        color: var(--muted-foreground);
      }
      .input:focus-visible {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px rgb(161 161 170 / 0.3);
      }
      .button {
        height: 36px;
        border: none;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .button:hover {
        opacity: 0.9;
      }
      .button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 12px;
      }
      .status::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
      }
      .status.success::before {
        background: var(--success);
      }
      .status.error {
        color: var(--destructive);
      }
      .status.error::before {
        background: var(--destructive);
      }
      .local-info {
        display: grid;
        gap: 4px;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--muted);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      kbd {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--muted);
        font:
          500 11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--foreground);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="/icon-48.png" alt="" />
      <div>
        <p class="title">Hover Translate</p>
        <p class="subtitle">段落を指して、右クリックで日本語に</p>
      </div>
    </header>

    <main class="content">
      <div class="field">
        <span class="label">翻訳エンジン</span>
        <div class="tabs" role="radiogroup" aria-label="翻訳エンジン">
          <input
            type="radio"
            name="provider"
            id="providerDeepl"
            value="deepl"
          />
          <label for="providerDeepl">DeepL</label>
          <input
            type="radio"
            name="provider"
            id="providerLocal"
            value="local"
          />
          <label for="providerLocal">端末内</label>
        </div>
      </div>

      <div class="field" id="deeplSettings">
        <label class="label" for="apiKey">DeepL API キー</label>
        <input
          class="input"
          type="password"
          id="apiKey"
          placeholder="xxxxxxxx-xxxx-…:fx"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">無料版と Pro 版のどちらのキーも使えます。</p>
      </div>

      <div class="local-info" id="localInfo" hidden>
        <p>
          Chrome
          に組み込まれた翻訳を使います。無料で、文章は外部に送られません。
        </p>
        <p>Chrome 138 以降が必要です。初回はモデルのダウンロードがあります。</p>
      </div>

      <button class="button" id="saveButton">保存</button>
      <div class="status" id="status" role="status"></div>
    </main>

    <footer class="footer">
      <div class="shortcut-row">
        <span>翻訳モードの切り替え</span>
        <kbd data-command="toggle-hover-mode">⌘ ⇧ L</kbd>
      </div>
      <div class="shortcut-row">
        <span>このページの翻訳を解消</span>
        <kbd data-command="clear-translations">⌘ ⇧ K</kbd>
      </div>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
